<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关键指标优化幅度</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #18181b;
      --color-ink:     #fafaf9;
      --color-muted:   #a8a29e;
      --color-accent:  #d97706;
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif;
      --font-serif:    'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: #09090b;
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar Chart · Impact Metrics</p>
    <h1>核心工程指标优化幅度</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metrics-bar-title metrics-bar-desc">
      <title id="metrics-bar-title">核心工程指标优化幅度对比</title>
      <desc id="metrics-bar-desc">六个工程指标的优化幅度横条图：计算峰值内存降低 94%（16 倍）、P99 查询延迟降低 89%（9 倍）、常规研发迭代周期缩短 60%、算子重复开发成本降低 40%、Token 调用成本降低 35%、大客户交付验收周期缩短 30%，条目下方标注来源项目。</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#18181b"/>

      <!-- ============ 网格与坐标 ============ -->
      <g stroke="rgba(250,250,249,0.08)" stroke-width="0.8">
        <line x1="408" y1="40" x2="408" y2="440"/>
        <line x1="584" y1="40" x2="584" y2="440"/>
        <line x1="760" y1="40" x2="760" y2="440"/>
        <line x1="936" y1="40" x2="936" y2="440"/>
      </g>
      <line x1="232" y1="40" x2="232" y2="440" stroke="rgba(250,250,249,0.28)" stroke-width="1"/>
      <line x1="232" y1="440" x2="936" y2="440" stroke="rgba(250,250,249,0.28)" stroke-width="1"/>

      <g fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="middle">
        <text x="232" y="456">0</text>
        <text x="408" y="456">25</text>
        <text x="584" y="456">50</text>
        <text x="760" y="456">75</text>
        <text x="936" y="456">100</text>
        <text x="936" y="472" letter-spacing="0.14em">优化幅度 %</text>
      </g>

      <!-- ============ 条目 ============ -->
      <!-- 计算峰值内存 ↓16× -->
      <rect x="232" y="64" width="164" height="32" fill="#18181b"/>
      <rect x="232" y="64" width="164" height="32" fill="rgba(168,162,158,0.15)" stroke="#a8a29e" stroke-width="1"/>
      <text x="216" y="78" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">计算峰值内存</text>
      <text x="216" y="92" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">淘宝 · OLAP 调优</text>
      <text x="404" y="84" fill="#a8a29e" font-size="10" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓16×</text>

      <!-- P99 查询延迟 ↓9×（焦点） -->
      <rect x="232" y="128" width="156" height="32" fill="#18181b"/>
      <rect x="232" y="128" width="156" height="32" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1"/>
      <text x="216" y="142" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">P99 查询延迟</text>
      <text x="216" y="156" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">淘宝 · OLAP 调优</text>
      <text x="396" y="148" fill="#d97706" font-size="10" font-weight="600" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓9×</text>

      <!-- 常规研发迭代周期 ↓60% -->
      <rect x="232" y="192" width="104" height="32" fill="#18181b"/>
      <rect x="232" y="192" width="104" height="32" fill="rgba(168,162,158,0.15)" stroke="#a8a29e" stroke-width="1"/>
      <text x="216" y="206" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">常规研发迭代周期</text>
      <text x="216" y="220" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">DataEng-Twin</text>
      <text x="344" y="212" fill="#a8a29e" font-size="10" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓60%</text>

      <!-- 算子重复开发成本 ↓40% -->
      <rect x="232" y="256" width="72" height="32" fill="#18181b"/>
      <rect x="232" y="256" width="72" height="32" fill="rgba(168,162,158,0.15)" stroke="#a8a29e" stroke-width="1"/>
      <text x="216" y="270" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">算子重复开发成本</text>
      <text x="216" y="284" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">城市大脑 · 孪生平台</text>
      <text x="312" y="276" fill="#a8a29e" font-size="10" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓40%</text>

      <!-- Token 调用成本 ↓35% -->
      <rect x="232" y="320" width="60" height="32" fill="#18181b"/>
      <rect x="232" y="320" width="60" height="32" fill="rgba(168,162,158,0.15)" stroke="#a8a29e" stroke-width="1"/>
      <text x="216" y="334" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">Token 调用成本</text>
      <text x="216" y="348" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">Roadmap Agent</text>
      <text x="300" y="340" fill="#a8a29e" font-size="10" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓35%</text>

      <!-- 交付验收周期 ↓30% -->
      <rect x="232" y="384" width="52" height="32" fill="#18181b"/>
      <rect x="232" y="384" width="52" height="32" fill="rgba(168,162,158,0.15)" stroke="#a8a29e" stroke-width="1"/>
      <text x="216" y="398" fill="#fafaf9" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC','PingFang SC',sans-serif" text-anchor="end">交付验收周期</text>
      <text x="216" y="412" fill="#78716c" font-size="9" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="end">城市大脑 · 专有云</text>
      <text x="292" y="404" fill="#a8a29e" font-size="10" font-family="'Geist Mono','SF Mono',Menlo,monospace" text-anchor="start">↓30%</text>
    </svg>
  </div>
</body>
</html>
